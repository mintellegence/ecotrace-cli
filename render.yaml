# Render Blueprint Specification for EcoTrace-CLI
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ecotrace-cli
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    healthCheckPath: /api/audit/summary
    autoDeploy: true
